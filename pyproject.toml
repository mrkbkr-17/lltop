[project]
name = "lltop"
version = "0.2.0"
description = "Like htop, but for LLMs. Live dashboard for Ollama: a streaming proxy that shows prompts, responses and speed as they are generated"
readme = "README.md"
authors = [
    { name = "Mark Baker" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lltop = "lltop:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
